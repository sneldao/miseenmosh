<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mise en Mosh — run the pass. Same tickets for everyone today. Be the tyrant, earn the stars." />
    <meta name="theme-color" content="#0d0b09" />
    <title>Mise en Mosh</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0b09; overflow: hidden; }
      canvas { display: block; }
      /* Zero-JS boot shell: paints before the bundle parses. React removes it on mount. */
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; text-align: center; padding: 2rem;
        background: radial-gradient(ellipse at 50% 35%, #2a1a10 0%, #0d0b09 65%);
        color: #ffd9a0; font-family: "Courier New", monospace;
        transition: opacity .4s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0; font-style: italic; letter-spacing: .06em;
        font-size: clamp(2rem, 7vw, 4rem); color: #ffd9a0;
        text-shadow: 0 0 30px rgba(255,140,40,.35);
      }
      #boot .sub { opacity: .75; font-size: clamp(.8rem, 2vw, 1rem); letter-spacing: .12em; }
      #boot .bar { width: min(20rem, 70vw); height: 4px; background: #3a2a1c; border-radius: 2px; overflow: hidden; }
      #boot .bar > div {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #e08a2a, #ffe6b0);
        border-radius: 2px;
        animation: bootslide 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootslide { from { transform: translateX(-40%); } to { transform: translateX(280%); } }
      #boot .status { font-size: .72rem; opacity: .6; letter-spacing: .08em; min-height: 1.2em; }
      #boot .retry { display: none; margin-top: .5rem; }
      #boot.stalled .retry { display: block; }
      #boot.stalled .status { opacity: 1; color: #ffb08a; }
      #boot .retry button {
        font-family: inherit; font-size: .9rem; letter-spacing: .12em;
        padding: .7rem 1.6rem; cursor: pointer;
        background: #2a1608; color: #ffd9a0; border: 1px solid #b06a2a; border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Mise en Mosh">
      <h1>MISE EN MOSH</h1>
      <div class="sub">LIGHTING THE PASS…</div>
      <div class="bar"><div></div></div>
      <div class="status" id="boot-status">warming the room</div>
      <div class="retry"><button onclick="location.reload()">RETRY</button></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fail-safe: if the module never boots (blocked CDN, ancient browser,
      // file://), say so instead of sitting on black.
      setTimeout(function () {
        if (!window.__booted) {
          var b = document.getElementById("boot");
          var s = document.getElementById("boot-status");
          if (b && s) {
            b.classList.add("stalled");
            s.textContent = "still lighting the pass — check your connection, then retry.";
          }
        }
      }, 15000);
    </script>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd9a0;background:#0d0b09;font-family:monospace;padding:2rem;text-align:center;">
        Mise en Mosh needs JavaScript to run the pass.
      </div>
    </noscript>
  </body>
</html>
